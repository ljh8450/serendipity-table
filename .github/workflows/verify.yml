name: Verify monorepo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@11.18.0
      - run: npm ci && npm run lint && npm run typecheck && npm run test:ci && npm run build
        working-directory: frontend
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21.0.9'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew check bootJar --no-daemon
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: backend/build/reports/tests
  e2e:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:15432/serendipity
      SPRING_DATASOURCE_USERNAME: serendipity
      SPRING_DATASOURCE_PASSWORD: local_dev_only
      APP_ALLOWED_ORIGINS: http://127.0.0.1:4173
      VITE_API_BASE_URL: http://127.0.0.1:8080
    services:
      db:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: serendipity
          POSTGRES_USER: serendipity
          POSTGRES_PASSWORD: local_dev_only
        ports: ['15432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install -g npm@11.18.0
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21.0.9'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci && npm run build
        working-directory: frontend
      - run: bash gradlew bootJar --no-daemon
        working-directory: backend
      - run: |
          java -jar backend/build/libs/serendipity-table.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail http://127.0.0.1:8080/api/system/status; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure
          path: |
            e2e/test-results
            backend.log
