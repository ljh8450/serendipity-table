name: Verify Supabase application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@11.18.0
      - run: npm ci && npm run lint && npm run typecheck && npm run test:ci && npm run build
        working-directory: frontend
  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npx --yes --package=deno@2.9.6 deno check supabase/functions/system-status/index.ts
      - run: npx --yes --package=deno@2.9.6 deno test supabase/functions/system-status/handler_test.ts
      - run: npx --yes supabase@2.121.0 start
      - run: docker exec -i supabase_db_serendipity-table psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/connection_permissions.sql
      - run: npx --yes supabase@2.121.0 stop
        if: always()
  e2e:
    needs: [frontend, supabase]
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54331
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install -g npm@11.18.0
      - run: npx --yes supabase@2.121.0 start
      - name: Configure local read-only connection
        run: |
          echo 'HEALTH_DATABASE_SSL=disable' > supabase/functions/.env.local
          echo 'APP_ALLOWED_ORIGINS=http://127.0.0.1:4173' >> supabase/functions/.env.local
      - run: npx --yes supabase@2.121.0 functions serve system-status --env-file supabase/functions/.env.local > edge.log 2>&1 &
      - run: |
          for i in $(seq 1 60); do
            if curl --fail http://127.0.0.1:54331/functions/v1/system-status; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure
          path: |
            e2e/test-results
            edge.log
      - run: npx --yes supabase@2.121.0 stop
        if: always()
